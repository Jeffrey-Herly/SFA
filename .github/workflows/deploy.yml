name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]

# Memberikan izin kepada robot GitHub untuk membaca kode dan mempublikasikan halaman
permissions:
  contents: read
  pages: write
  id-token: write

# Mencegah tabrakan jika Anda melakukan push berkali-kali dalam waktu singkat
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: ./apps/web

      - name: Build project
        run: npm run build
        working-directory: ./apps/web

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact (dist folder)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
